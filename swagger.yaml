swagger: "2.0"
info:
  title: SessionBloom API
  description: API for timer and session management
  version: "0.1.0"
basePath: /

definitions:
  User:
    type: object
    properties:
      id:
        type: string
        description: User UUID
      code:
        type: string
        description: User public code
      email:
        type: string
        format: email
      first_name:
        type: string
      last_name:
        type: string
      status:
        type: string
        enum: [ACTIVE, DELETED, PENDING]
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

paths:
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        200:
          description: A list of users
          schema:
            type: array
            items:
              $ref: '#/definitions/User'
    post:
      tags:
        - Users
      summary: Create a new user
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - email
              - first_name
              - last_name
            properties:
              email:
                type: string
                format: email
              first_name:
                type: string
              last_name:
                type: string
      responses:
        201:
          description: User created
          schema:
            $ref: '#/definitions/User'
        400:
          description: Validation error

  /users/{user_id}:
    get:
      tags:
        - Users
      summary: Get a user by ID
      parameters:
        - name: user_id
          in: path
          required: true
          type: string
      responses:
        200:
          description: User found
          schema:
            $ref: '#/definitions/User'
        404:
          description: User not found