
services:

  #redis: ...

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ~/certs:/certs:ro # readonly
    networks:
      - ory_network
    restart: unless-stopped

