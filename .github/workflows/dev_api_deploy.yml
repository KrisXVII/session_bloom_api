name: dev_api_deploy.yml
on:
  push:
    branches:
      - dev

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        env:
          FLASK_ENV: test
        run: pytest

  build:
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0  # Get all history
          clean: true

#      - name: Raise dev database before running migrations # To use in prod pipeline
#        run: |
#          pip install psycopg2-binary
#          cd ${{secrets.PROJECT_PATH}}
#          docker-compose -f dev_db.docker-compose.yml up -d database_dev
#
#      - name: Run migrations from HOST
#        run: |
#          cd ${{secrets.PROJECT_PATH}}
#          export DATABASE_URL=${{secrets.DATABASE_DEV_URL}}
#          alembic upgrade head

      - name: Rebuild and restart containers
        run: |
          cd ${{secrets.PROJECT_PATH}}
          docker-compose -f dev_db.docker-compose.yml down
          docker-compose -f dev_db.docker-compose.yml up -d --build
          docker image prune -f
