version: v1.0.0

dsn: ${KRATOS_DSN}

serve:
  public:
    base_url: ${URLS_SELF_PUBLIC}
    cors:
      enabled: true
      allowed_origins:
        - ${URLS_DEFAULT_RETURN_TO}
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: ${URLS_SELF_ADMIN}

selfservice:
  default_browser_return_url: ${URLS_DEFAULT_RETURN_TO}
  allowed_return_urls:
    - ${URLS_DEFAULT_RETURN_TO}
    - http://localhost:5001

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        min_password_length: 8
    code:
      enabled: true

  flows:
    error:
      ui_url: ${AUTH_ERROR_URL}
    settings:
      ui_url: ${AUTH_SETTINGS_URL}
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      ui_url: ${AUTH_RECOVERY_URL}
    verification:
      enabled: true
      ui_url: ${AUTH_VERIFY_URL}
    logout:
      after:
        default_browser_return_url: ${AUTH_LOGIN_URL}
    login:
      ui_url: ${AUTH_LOGIN_URL}
      lifespan: 10m
    registration:
      lifespan: 10m
      ui_url: ${AUTH_REGISTRATION_URL}
      after:
        password:
          hooks:
            - hook: session

log:
  level: debug
  format: text

secrets:
  default:
    - ${SECRETS_DEFAULT}
  cookie:
    - ${SECRETS_COOKIE}
  cipher:
    - ${SECRETS_CIPHER}

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://localhost:1025
    