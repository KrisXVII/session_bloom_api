version: v1.0.0

dsn: ${KRATOS_URL}?sslmode=require

serve:
  public:
    base_url: http://${EC2_IP}:4433
    cors:
      enabled: true
      allowed_origins:
        - http://${EC2_IP}:5001
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: http://kratos:4434

selfservice:
  default_browser_return_url: http://${EC2_IP}:5001/
  allowed_return_urls:
    - http://${EC2_IP}:5001
    - http://localhost:5001

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        min_password_length: 8
    code:
      enabled: true

  flows:
    error:
      ui_url: http://${EC2_IP}:5001/auth/error
    settings:
      ui_url: http://${EC2_IP}:5001/auth/settings
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      ui_url: http://${EC2_IP}:5001/auth/recovery
    verification:
      enabled: true
      ui_url: http://${EC2_IP}:5001/auth/verify
    logout:
      after:
        default_browser_return_url: http://${EC2_IP}:5001/auth/login
    login:
      ui_url: http://${EC2_IP}:5001/auth/login
      lifespan: 10m
    registration:
      lifespan: 10m
      ui_url: http://${EC2_IP}:5001/auth/registration
      after:
        password:
          hooks:
            - hook: session

log:
  level: debug
  format: text

secrets:
  default:
    - ${SECRETS_DEFAULT}
  cookie:
    - ${SECRETS_COOKIE}
  cipher:
    - ${SECRETS_CIPHER}

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://localhost:1025
    