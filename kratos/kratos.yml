version: v1.0.0

dsn: # ${DSN}

serve:
  public:
    base_url: # ${SERVE_PUBLIC_BASE_URL}
    cors:
      enabled: true
      allowed_origins:
        # - ${SERVE_PUBLIC_CORS_ALLOWED_ORIGINS_0}
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: # ${SERVE_ADMIN_BASE_URL}

selfservice:
  default_browser_return_url:
  allowed_return_urls:

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        min_password_length: 8
    code:
      enabled: true

  flows:
    error:
      ui_url: # ${SELFSERVICE_FLOWS_ERROR_UI_URL}
    settings:
      ui_url: # ${SELFSERVICE_FLOWS_SETTINGS_UI_URL}
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      ui_url: # ${SELFSERVICE_FLOWS_RECOVERY_UI_URL}
    verification:
      enabled: true
      ui_url: # ${SELFSERVICE_FLOWS_VERFIICATION_UI_URL}
    logout:
      after:
        default_browser_return_url: # ${SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL}
    login:
      ui_url: # ${SELFSERVICE_FLOWS_LOGIN_UI_URL}
      lifespan: 10m
    registration:
      lifespan: 10m
      ui_url: # ${SELFSERVICE_FLOWS_REGISTRATION_UI_URL}
      after:
        password:
          hooks:
            - hook: session

log:
  level: debug
  format: text

secrets:
  default:
    # - ${SECRETS_DEFAULT}
  cookie:
    # - ${SECRETS_COOKIE}
  cipher:
    # - ${SECRETS_CIPHER}

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://localhost:1025
    